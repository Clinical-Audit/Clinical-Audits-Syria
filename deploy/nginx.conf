# /etc/nginx/sites-available/clinicalaudit-syria
# HTTPS reverse proxy for the Clinical Audit Syria platform.
# Replace clinicalaudit-syria.example.org with your real domain.

server {
    listen 80;
    listen [::]:80;
    server_name clinicalaudit-syria.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinicalaudit-syria.example.org;

    ssl_certificate     /etc/letsencrypt/live/clinicalaudit-syria.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicalaudit-syria.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
